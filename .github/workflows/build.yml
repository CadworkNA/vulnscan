name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Weekly: re-run the detection regression test and the self-scan against fresh vulnerability data,
  # so a database or toolchain regression is caught even when nothing is committed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every run builds the image and tests it from the inside. A push to main publishes it to GHCR tagged with the
  # commit SHA. A v* tag is a release (semantic version, see "Image tags"): it publishes :X.Y.Z plus the floating
  # :X.Y, :X and :latest, and the release job below turns it into a GitHub release. Published images carry signed
  # build provenance and an SBOM attestation:
  #   gh attestation verify oci://ghcr.io/cadworkna/vulnscan:<tag> --owner CadworkNA
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write           # Sigstore signing of attestations
      attestations: write
      artifact-metadata: write  # storage record linking the image to this repository

    env:
      IMAGE: ghcr.io/cadworkna/vulnscan
      PUSH: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: vulnscan:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every published image is tagged with the commit SHA. A v* tag must be a semantic version (vX.Y.Z or
      # vX.Y.Z-prerelease) equal to the package version (vulnscan --version), checked here so a mismatch fails
      # before the tests run. It adds :X.Y.Z and, for a stable release, each of :X.Y, :X and :latest for which it
      # is the highest stable version: a backport such as 1.0.5 after 1.1.0 moves :1.0 but not :1 or :latest.
      # A prerelease gets only its exact version.
      - name: Image tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, sys
          image, ref = os.environ["IMAGE"], os.environ["GITHUB_REF"]
          tags = [f"{image}:{os.environ['GITHUB_SHA']}"]
          if ref.startswith("refs/tags/"):
              version = ref.removeprefix("refs/tags/v")
              m = re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?", version)
              if not m:
                  sys.exit(f"::error::tag {ref.removeprefix('refs/tags/')} is not a semantic version (vX.Y.Z[-pre])")
              out = subprocess.run(["docker", "run", "--rm", "vulnscan:test", "--version"],
                                   capture_output=True, text=True, check=True).stdout.split()
              if out[-1] != version:
                  sys.exit(f"::error::tag says {version} but the package says {out[-1]}: "
                           "bump pyproject.toml and vulnscan/__init__.py, then tag again")
              tags.append(f"{image}:{version}")
              if not m[4]:
                  refs = subprocess.run(["gh", "api", "--paginate", f"repos/{os.environ['GITHUB_REPOSITORY']}"
                                         "/git/matching-refs/tags/v", "--jq", ".[].ref"],
                                        capture_output=True, text=True, check=True).stdout.split()
                  v = tuple(map(int, m.groups()[:3]))
                  stable = {v} | {tuple(map(int, x.groups())) for r in refs
                                  if (x := re.fullmatch(r"refs/tags/v(\d+)\.(\d+)\.(\d+)", r))}
                  for name, n in ((f"{v[0]}.{v[1]}", 2), (f"{v[0]}", 1), ("latest", 0)):
                      if v == max(s for s in stable if s[:n] == v[:n]):
                          tags.append(f"{image}:{name}")
          print("\n".join(tags))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tags={','.join(tags)}\n")
          EOF

      - name: Unit tests (with coverage)
        run: |
          docker run --rm -v "$PWD:/src:ro" -e PYTHONPATH=/src -e PYTHONDONTWRITEBYTECODE=1 \
            -e COVERAGE_FILE=/tmp/.coverage --entrypoint sh vulnscan:test -c '
              uv pip install -q --python /opt/venv/bin/python pytest pytest-cov openpyxl "cyclonedx-python-lib[json-validation]" &&
              cd /src && python -m pytest -q --cov=vulnscan --cov-report=term --cov-fail-under=65'

      - name: Detection regression test (full pipeline on known-vulnerable public artifacts)
        run: |
          docker run --rm -v "$PWD:/src:ro" -e PYTHONPATH=/src -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint sh vulnscan:test -c '
              uv pip install -q --python /opt/venv/bin/python pytest openpyxl &&
              cd /src && python -m pytest -q -m integration'

      - name: CLI smoke test
        run: |
          docker run --rm vulnscan:test --version
          docker run --rm vulnscan:test --help
          mkdir -p smoke && docker run --rm -v "$PWD/smoke:/work" vulnscan:test --list

      - name: SBOM and self-scan of the image
        run: |
          mkdir -p sbom
          docker save vulnscan:test -o sbom/image.tar
          docker run --rm -v "$PWD/sbom:/sbom" --entrypoint sh vulnscan:test -c '
            syft scan docker-archive:/sbom/image.tar -o cyclonedx-json=/sbom/vulnscan.cdx.json -q &&
            grype db update -q &&
            grype sbom:/sbom/vulnscan.cdx.json -o json --file /sbom/self-scan.json -q &&
            grype sbom:/sbom/vulnscan.cdx.json -o table -q'
          rm sbom/image.tar
          # Fail on anything CISA lists as actively exploited, unless it is a documented exception that has
          # not expired (.github/selfscan-exceptions.json).
          python3 - <<'EOF'
          import datetime, json, sys
          m = json.load(open("sbom/self-scan.json", encoding="utf-8"))["matches"]
          exc = json.load(open(".github/selfscan-exceptions.json", encoding="utf-8"))["exceptions"]
          today = datetime.date.today()
          kev = {}
          for x in m:
              if x["vulnerability"].get("knownExploited"):
                  ids = {x["vulnerability"]["id"]} | {r["id"] for r in x.get("relatedVulnerabilities", [])}
                  kev[x["vulnerability"]["id"]] = (ids, x["artifact"]["name"], x["artifact"]["version"])
          bad = []
          for vid, (ids, pkg, ver) in sorted(kev.items()):
              e = next((e for e in exc if ids & ({e["id"]} | set(e.get("aliases", [])))), None)
              if e is None:
                  bad.append(f"{vid} in {pkg} {ver}: actively exploited and not excepted")
              elif datetime.date.fromisoformat(e["expires"]) < today:
                  bad.append(f"{vid} in {pkg} {ver}: exception expired on {e['expires']} - re-evaluate")
              else:
                  print(f"::warning::{vid} in {pkg} {ver} accepted until {e['expires']}: {e['reason']}")
          print(f"{len(m)} matches, {len(kev)} actively exploited")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Upload SBOM and self-scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnscan-sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: ignore

      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # BuildKit attestations, pushed with the image: package list (SBOM) and how it was built (provenance).
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=vulnscan
            org.opencontainers.image.description=Vulnerability scanner for shipped files (SVN or local folders)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha

      # GitHub artifact attestations need a public repository on the Team plan; they switch on automatically
      # once the repository is public. (The BuildKit SBOM/provenance above are pushed in every case.)
      - name: Attest build provenance (Sigstore)
        if: env.PUSH == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM (Sigstore)
        if: env.PUSH == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom/vulnscan.cdx.json
          push-to-registry: true

  # A v* tag becomes a GitHub release once its image is published and attested: notes generated from the changes
  # since the previous release, headed by the image tags, digest and verify commands, with the image SBOM and the
  # self-scan attached together with the Sigstore bundle that signs them (SLSA build provenance).
  # It is marked Latest only when the image got :latest (not for a prerelease or a backport).
  release:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write      # Sigstore signing of the release files
      attestations: write

    steps:
      - name: Download SBOM and self-scan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vulnscan-sbom-${{ github.sha }}
          path: sbom

      - name: Attest the release files (Sigstore)
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            sbom/vulnscan.cdx.json
            sbom/self-scan.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/cadworkna/vulnscan
          TAGS: ${{ needs.image.outputs.tags }}
          DIGEST: ${{ needs.image.outputs.digest }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="vulnscan-$version.sigstore.json"
          cp "$BUNDLE" "sbom/$bundle"
          t='`'
          tag_list=$(tr ',' '\n' <<< "$TAGS" | sed "s|^$IMAGE:\(.*\)|$t:\1$t|" | paste -sd ' ')
          cat > notes.md <<EOF
          ## Container image

          ${t}${t}${t}sh
          podman pull $IMAGE:$version
          ${t}${t}${t}

          Digest ${t}$DIGEST${t}, tagged $tag_list. Verify its provenance and SBOM attestation:

          ${t}${t}${t}sh
          gh attestation verify oci://$IMAGE@$DIGEST --owner $GITHUB_REPOSITORY_OWNER
          ${t}${t}${t}

          Attached: ${t}vulnscan.cdx.json${t} (CycloneDX SBOM of the image) and ${t}self-scan.json${t} (Grype scan of
          the image when it was built), signed by ${t}$bundle${t} (Sigstore bundle, SLSA build provenance):

          ${t}${t}${t}sh
          gh attestation verify vulnscan.cdx.json --owner $GITHUB_REPOSITORY_OWNER --bundle $bundle
          ${t}${t}${t}

          EOF
          flags=(--latest=false)
          [[ ",$TAGS," == *",$IMAGE:latest,"* ]] && flags=(--latest)
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "vulnscan $version" --notes-file notes.md --generate-notes "${flags[@]}" \
            sbom/vulnscan.cdx.json sbom/self-scan.json "sbom/$bundle"
