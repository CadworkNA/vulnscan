name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Weekly: re-run the detection regression test and the self-scan against fresh vulnerability data,
  # so a database or toolchain regression is caught even when nothing is committed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every run builds the image and tests it from the inside. A push to main publishes it to GHCR tagged with the
  # commit SHA (no `latest`: VULNSCAN_TAG in the stack names exactly what runs); a v* tag also publishes the
  # version (v1.2.0 -> :1.2.0). Published images carry signed build provenance and an SBOM attestation:
  #   gh attestation verify oci://ghcr.io/cadworkna/vulnscan:<tag> --owner CadworkNA
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write
      id-token: write       # Sigstore signing of attestations
      attestations: write

    env:
      IMAGE: ghcr.io/cadworkna/vulnscan
      PUSH: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: vulnscan:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests (with coverage)
        run: |
          docker run --rm -v "$PWD:/src:ro" -e PYTHONPATH=/src -e PYTHONDONTWRITEBYTECODE=1 \
            -e COVERAGE_FILE=/tmp/.coverage --entrypoint sh vulnscan:test -c '
              uv pip install -q --python /opt/venv/bin/python pytest pytest-cov openpyxl "cyclonedx-python-lib[json-validation]" &&
              cd /src && python -m pytest -q --cov=vulnscan --cov-report=term --cov-fail-under=65'

      - name: Detection regression test (full pipeline on known-vulnerable public artifacts)
        run: |
          docker run --rm -v "$PWD:/src:ro" -e PYTHONPATH=/src -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint sh vulnscan:test -c '
              uv pip install -q --python /opt/venv/bin/python pytest openpyxl &&
              cd /src && python -m pytest -q -m integration'

      - name: CLI smoke test
        run: |
          docker run --rm vulnscan:test --version
          docker run --rm vulnscan:test --help
          mkdir -p smoke && docker run --rm -v "$PWD/smoke:/work" vulnscan:test --list

      - name: SBOM and self-scan of the image
        run: |
          mkdir -p sbom
          docker save vulnscan:test -o sbom/image.tar
          docker run --rm -v "$PWD/sbom:/sbom" --entrypoint sh vulnscan:test -c '
            syft scan docker-archive:/sbom/image.tar -o cyclonedx-json=/sbom/vulnscan.cdx.json -q &&
            grype db update -q &&
            grype sbom:/sbom/vulnscan.cdx.json -o json --file /sbom/self-scan.json -q &&
            grype sbom:/sbom/vulnscan.cdx.json -o table -q'
          rm sbom/image.tar
          # Fail on anything CISA lists as actively exploited, unless it is a documented exception that has
          # not expired (.github/selfscan-exceptions.json).
          python3 - <<'EOF'
          import datetime, json, sys
          m = json.load(open("sbom/self-scan.json", encoding="utf-8"))["matches"]
          exc = json.load(open(".github/selfscan-exceptions.json", encoding="utf-8"))["exceptions"]
          today = datetime.date.today()
          kev = {}
          for x in m:
              if x["vulnerability"].get("knownExploited"):
                  ids = {x["vulnerability"]["id"]} | {r["id"] for r in x.get("relatedVulnerabilities", [])}
                  kev[x["vulnerability"]["id"]] = (ids, x["artifact"]["name"], x["artifact"]["version"])
          bad = []
          for vid, (ids, pkg, ver) in sorted(kev.items()):
              e = next((e for e in exc if ids & ({e["id"]} | set(e.get("aliases", [])))), None)
              if e is None:
                  bad.append(f"{vid} in {pkg} {ver}: actively exploited and not excepted")
              elif datetime.date.fromisoformat(e["expires"]) < today:
                  bad.append(f"{vid} in {pkg} {ver}: exception expired on {e['expires']} - re-evaluate")
              else:
                  print(f"::warning::{vid} in {pkg} {ver} accepted until {e['expires']}: {e['reason']}")
          print(f"{len(m)} matches, {len(kev)} actively exploited")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Upload SBOM and self-scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnscan-sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: ignore

      - name: Image tags
        id: tags
        run: |
          tags="$IMAGE:${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="$tags,$IMAGE:${GITHUB_REF_NAME#v}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # BuildKit attestations, pushed with the image: package list (SBOM) and how it was built (provenance).
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=vulnscan
            org.opencontainers.image.description=Vulnerability scanner for shipped files (SVN or local folders)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha

      # GitHub artifact attestations need a public repository on the Team plan; they switch on automatically
      # once the repository is public. (The BuildKit SBOM/provenance above are pushed in every case.)
      - name: Attest build provenance (Sigstore)
        if: env.PUSH == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM (Sigstore)
        if: env.PUSH == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom/vulnscan.cdx.json
          push-to-registry: true
