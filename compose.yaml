# vulnscan - run with Docker/Podman Compose or as a Dockhand stack.
#
#   Scheduled (stays up, scans on VULNSCAN_SCHEDULE, e-mails the report):
#     docker compose up -d
#   One-off scan (report lands in ./reports):
#     docker compose run --rm scan --tools_2026
#     docker compose run --rm scan --all
#
# Configuration comes from .env (see .env.example). VULNSCAN_TAG names the image to
# run: an exact release (1.2.3) pins what runs, a major version (1) follows updates.

name: vulnscan

x-vulnscan: &vulnscan
  image: ghcr.io/cadworkna/vulnscan:${VULNSCAN_TAG:?set VULNSCAN_TAG to a release version (e.g. 1.2.3) in .env}
  env_file: .env
  environment:
    TZ: ${TZ:-America/Toronto}
  volumes:
    # SVN checkouts + vulnerability databases, kept between runs (tens of GB for all repositories)
    - vulnscan-cache:/cache
    # reports (.xlsx) and per-run evidence (SBOMs, raw scanner output, scan.log)
    - ${VULNSCAN_REPORTS:-./reports}:/work
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # Long-running scheduler: scans on VULNSCAN_SCHEDULE (cron, container TZ) and e-mails the result.
  scheduled:
    <<: *vulnscan
    restart: unless-stopped
    command: ${VULNSCAN_ARGS:---all --email} --scheduled
    environment:
      TZ: ${TZ:-America/Toronto}
      VULNSCAN_SCHEDULE: ${VULNSCAN_SCHEDULE:-0 2 * * 1}

  # Manual runs: `docker compose run --rm scan <arguments>` (not started by `up`).
  scan:
    <<: *vulnscan
    profiles: [manual]
    command: ["--help"]

volumes:
  vulnscan-cache:
